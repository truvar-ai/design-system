name: Release

# On every push to main:
# - changesets waiting: opens (or updates) the "Version packages" pull request, which bumps the version
#   and writes CHANGELOG.md. Nothing is published yet.
# - that pull request merged: builds the package, publishes it to npm with provenance and creates a GitHub release.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # push the version commit and tags, create GitHub releases
  pull-requests: write # open the "Version packages" pull request
  id-token: write # npm provenance: proves the package was built here, from this repo

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # v2 reads the output of Changesets CLI v3 (v1 doesn't: it publishes, then skips the tag and GitHub release)
      - uses: changesets/action@v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: Version packages
          commit-message: Version packages
          create-github-releases: true
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }} # an npm granular access token, saved in the repo's Actions secrets
